application_configuration:
  env: ${oc.env:APP_ENV,debug}
  run: async
  log: ${oc.env:LOG_LEVEL,INFO}

  server:
    asgi:
      agent-runtime: ${server.agent-runtime}

  connector:
    api:
      nvidia_llm: ${connector.nvidia_llm_provider}
      homelab_llm: ${connector.homelab_llm_provider}
    database:
      mongodb: ${connector.mongodb}
      sqlite: ${connector.sqlite}
      postgresql: ${connector.postgresql}
    telemetry:
      open_telemetry: ${connector.telemetry}
    mcp:
      toolbox: ${connector.toolbox}
    a2a:
      a2a_self: ${connector.a2a_self}
      agent_orchestration: ${connector.agent_orchestration}
      agent_chat: ${connector.agent_chat}
      agent_observation: ${connector.agent_observation}
      agent_analysis: ${connector.agent_analysis}
      agent_coding: ${connector.agent_coding}
      agent_security: ${connector.agent_security}
      agent_kitchen: ${connector.agent_kitchen}
      agent_travel: ${connector.agent_travel}

  operation:
    conversation_mongodb: ${operation.conversation_mongodb}
    conversation_sqlite: ${operation.conversation_sqlite}
    a2a_tasks_postgresql: ${operation.a2a_tasks_postgresql}
    a2a_tasks_sqlite: ${operation.a2a_tasks_sqlite}
    a2a: ${operation.a2a}
    qwen3_5-0_8b: ${operation.qwen3_5-0_8b}
    qwen3_5-2b: ${operation.qwen3_5-2b}
    qwen3-1_7b: ${operation.qwen3-1_7b}
    qwen3-8b: ${operation.qwen3-8b}
    qwen3-14b: ${operation.qwen3-14b}
    lfm2-8b-a1b: ${operation.lfm2-8b-a1b}
    ministral-8b-instruct-2410: ${operation.ministral-8b-instruct-2410}
    gigachat3_1-10b-a1_8b: ${operation.gigachat3_1-10b-a1_8b}
    gpt-oss-20b: ${operation.gpt-oss-20b}
    deepseek-v4_1-flash: ${operation.deepseek-v4_1-flash}
    nemotron-3_5-super-vl-120b-a12b: ${operation.nemotron-3_5-super-vl-120b-a12b}
    nemotron-3-ultra-550b-a55b: ${operation.nemotron-3-ultra-550b-a55b}
    nemotron-3_5-lightning-30b-a3b: ${operation.nemotron-3_5-lightning-30b-a3b}
    nemotron-3-nano-omni-30b-a3b-reasoning: ${operation.nemotron-3-nano-omni-30b-a3b-reasoning}
    agent_act: ${operation.agent_act}
    agent_context: ${operation.agent_context}
    agent_plan: ${operation.agent_plan}
    agent_reflection: ${operation.agent_reflection}
    agent_guard: ${operation.agent_guard}
    agent_summary: ${operation.agent_summary}
