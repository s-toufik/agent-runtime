server:
  agent-runtime:
    name: agent-runtime
    type: asgi
    base_path: ${oc.env:WEB_BASE_PATH,""}
    docs: ${oc.env:WEB_DOCS,false}
    cors_origins: ["*"]
    parameters:
      max_concurrent_streams: ${oc.env:MAX_CONCURRENT_STREAMS,200}
      answer_delivery: ${oc.env:AGENT_ANSWER_DELIVERY,stream}
