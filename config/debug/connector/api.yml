connector:
  nvidia_llm_provider:
    name: nvidia_nim
    type: api
    base_url: ${oc.env:NVIDIA_LLM_BASE_URL,''}
    timeout: 120
    retry: 3
    auth:
      type: token
      key_name: apikey
      key_value: ${oc.env:NVIDIA_LLM_API_KEY,''}

  homelab_llm_provider:
    name: homelab
    type: api
    base_url: ${oc.env:HOMELAB_LLM_BASE_URL,''}
    timeout: 120
    retry: 3
    auth:
      type: token
      key_name: apikey
      key_value: ${oc.env:HOMELAB_LLM_API_KEY,''}



