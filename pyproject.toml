[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "1.0.0"
authors = [
    { name = "Toufik Saouchi", email = "toufik.saouchi@gmail.com" },
]
description = "Analytics agent -- talks to its MCP toolbox as an independently deployed service"
readme = "Readme.md"
requires-python = ">=3.14"
keywords = ["llm", "agent", "langgraph", "langchain", "mcp", "analytics", "fastapi", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "uvloop",
    "starlette",
    "httpx",
    "httpx2",
    "aiosqlite",
    "mcp",
    "pycraftcore[application_configuration,authentication,circuit_breaker,http,logger,repository,resilient_http,retry,telemetry]>=2.1.0",
    "pydantic>=2",
    "python-dotenv",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pymongo>=4.9,<4.18",
    "langgraph-checkpoint-mongodb",
]

[project.scripts]
agent-runtime = "bootstrap.application.agent_application:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.151.9",
    "Faker",
    "ruff",
    "ty",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

#[tool.uv.sources]
#pycraftcore = { path = "../pycraftcore", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = [
    "E501",   # line length, handled by the formatter
    "BLE001", # blind exception, deliberate at adapter boundaries
]

[tool.ty.src]
include = ["src"]
exclude = [".venv", "tests"]

[project.urls]
Homepage = "https://github.com/s-toufik/agent-runtime"
Repository = "https://github.com/s-toufik/agent-runtime"
Issues = "https://github.com/s-toufik/agent-runtime/issues"

